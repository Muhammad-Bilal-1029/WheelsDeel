<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post An Ad - Car Marketplace</title>
    <!-- Humari select ki hui design theme stylesheet -->
    <link rel="stylesheet" href="../css/style.css?v=5">
</head>
<body>

    <!-- Professional Navbar Header -->
    <nav class="navbar">
        <div class="brand">Wheels<span>Deal</span></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#" id="logoutBtn" style="display: none;" onclick="logoutUser(); return false;">Logout</a>
        </div>
    </nav>

    <!-- Main Form Section Layer -->
    <div class="form-wrapper">
        <div class="form-container">
            <h2>Post Your Car Ad</h2>
            <p class="subtitle">Enter correct details to find the best buyers quickly.</p>
            
            <!-- Error feedback block -->
            <div id="error-box" class="error-message" style="display: none;"></div>

            <form id="sellForm">
                <!-- Car Brand Input -->
                <div class="form-group">
                    <label for="brand">Car Brand / Make</label>
                    <input type="text" id="brand" maxlength="80" placeholder="e.g., Honda, Toyota, Suzuki" required>
                </div>

                <!-- Car Model Input -->
                <div class="form-group">
                    <label for="model">Car Model</label>
                    <input type="text" id="model" maxlength="80" placeholder="e.g., Civic, Corolla, Alto" required>
                </div>

                <!-- Manufacturing Year Input -->
                <div class="form-group">
                    <label for="year">Model Year</label>
                    <input type="number" id="year" min="1980" max="2027" placeholder="e.g., 2024" required>
                </div>

                <!-- Car Price Input -->
                <div class="form-group">
                    <label for="price">Price (PKR)</label>
                    <input type="number" id="price" min="1" max="1000000000" placeholder="e.g., 2500000" required>
                </div>

                <!-- Seller Contact Phone Input -->
                <div class="form-group">
                    <label for="phone">Contact Phone Number</label>
                    <input type="tel" id="phone" maxlength="32" pattern="\+?[0-9\s\-()]{7,32}" title="Enter a valid phone number (7-15 digits)" placeholder="e.g., 03001234567" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">Submit Vehicle Ad</button>
            </form>
            
            <div class="form-footer">
                <a href="index.html">← Back to Marketplace</a>
            </div>
        </div>
    </div>

    <!-- Login check, logout aur ad submit sab app.js mai hay (session HttpOnly cookie mai hota hay) -->
    <script src="../js/app.js"></script>
</body>
</html>
