<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - WheelDeal</title>
    <link rel="stylesheet" href="../css/style.css?v=5">
    <link rel="stylesheet" href="../css/overrides.css?v=1">
    <style>
        .admin-wrap { max-width: 1150px; margin: 1.5rem auto 3rem; padding: 0 1rem; }
        .admin-wrap h1 { margin-bottom: 0.25rem; }
        .muted { color: #64748b; }
        .error { color: #dc2626; font-weight: 600; }
        #admin-msg { min-height: 1.5rem; font-weight: 600; margin: 0.5rem 0; }
        #admin-msg.is-error { color: #dc2626; }
        #admin-msg.is-ok { color: #166534; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin: 1rem 0; }
        .stat { border: 1px solid #e2e8f0; border-radius: 10px; padding: 0.75rem 1rem; background: #fff; }
        .stat strong { display: block; font-size: 1.6rem; color: #0f172a; }
        .stat span { color: #64748b; font-size: 0.85rem; }
        .stat.alert strong { color: #dc2626; }

        .tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1rem 0; }
        .tabs button { padding: 0.5rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; cursor: pointer; font-weight: 600; }
        .tabs button[aria-selected="true"] { background: #0f172a; color: #fff; border-color: #0f172a; }

        .toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
        .toolbar input, .toolbar select { padding: 0.4rem 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px; }

        .table-wrap { overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; }
        .table-wrap table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .table-wrap th, .table-wrap td { padding: 0.6rem 0.75rem; text-align: left; vertical-align: top; border-bottom: 1px solid #f1f5f9; }
        .table-wrap th { background: #f8fafc; color: #475569; white-space: nowrap; }
        .table-wrap td { color: #0f172a; }

        .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; margin: 0 0.25rem 0.25rem 0; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .badge-amber { background: #fef3c7; color: #92400e; }
        .badge-green { background: #dcfce7; color: #166534; }
        .badge-gray { background: #e2e8f0; color: #334155; }
        .badge-blue { background: #dbeafe; color: #1e40af; }

        .btn-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .abtn { padding: 0.3rem 0.65rem; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        .abtn-danger { background: #dc2626; border-color: #dc2626; color: #fff; }
        .abtn-ok { background: #166534; border-color: #166534; color: #fff; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand"><img class="brand-logo" src="../images/wheeldeal-logo.png" alt="WheelDeal"><span class="brand-label">Admin</span></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#" id="adminLogout">Logout</a>
        </div>
    </nav>

    <main class="admin-wrap">
        <h1>Admin Panel</h1>
        <p class="muted">Reports review karo, ads hide/restore karo, users ban karo. Har action activity log mein record hota hay.</p>
        <p id="admin-msg" role="status"></p>

        <section id="admin-stats" class="stats" aria-label="Overview"></section>

        <div class="tabs" role="tablist" aria-label="Admin sections">
            <button type="button" data-tab="reports" role="tab">Reports</button>
            <button type="button" data-tab="ads" role="tab">Ads</button>
            <button type="button" data-tab="users" role="tab">Users</button>
            <button type="button" data-tab="log" role="tab">Activity log</button>
        </div>

        <section id="tab-panel" aria-live="polite"></section>
    </main>

    <script src="../js/admin.js"></script>
</body>
</html>
