<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WheelDeal - Modern Car Marketplace</title>
    <link rel="stylesheet" href="../css/style.css?v=5">
    <link rel="stylesheet" href="../css/overrides.css?v=1">
    <link rel="stylesheet" href="../css/ads-features.css?v=1">
</head>
<body>

    <!-- Header, 2 rows. Row 1: search (center) + login/logout/welcome (right). Row 2: logo (left) + page links -->
    <header class="site-header">
        <div class="header-top">
            <form class="navbar-search" id="navbar-search" role="search">
                <input type="search" id="search-brand" placeholder="Search by brand (e.g. Toyota)" aria-label="Search by car brand" maxlength="50">
                <button type="submit" aria-label="Search vehicles" title="Search vehicles">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                </button>
            </form>
            <div class="auth-links" id="auth-links-container"></div>
        </div>
        <nav class="navbar">
            <a class="brand" href="index.html"><img class="brand-logo" src="../images/wheeldeal-logo.png" alt="WheelDeal"></a>
            <div class="nav-links" id="nav-links-container"></div>
        </nav>
    </header>

    <section class="home-hero" id="home">
        <div class="home-hero-content">
            <p class="section-eyebrow">WELCOME TO WHEELDEAL</p>
            <h1>Find the car<br>that moves you.</h1>
            <p>Explore trusted listings and discover your next ride.</p>
            <a class="home-hero-button" href="#available-vehicles">Browse available cars</a>
        </div>
    </section>

    <div class="container">
        <h2 id="available-vehicles" style="margin-bottom: 1.5rem; font-weight: 800; color: #1e3a8a; scroll-margin-top: 6rem;">Available Vehicles</h2>

        <!-- Filters + sorting (header ke search box ke saath mil kar kaam karte hain) -->
        <form class="filter-panel" id="filter-form" aria-label="Filter vehicles">
            <div class="filter-grid">
                <label>City
                    <input type="text" id="filter-city" maxlength="60" placeholder="e.g. Lahore">
                </label>
                <label>Fuel
                    <select id="filter-fuel">
                        <option value="">Any</option>
                        <option value="petrol">Petrol</option>
                        <option value="diesel">Diesel</option>
                        <option value="hybrid">Hybrid</option>
                        <option value="electric">Electric</option>
                        <option value="cng">CNG</option>
                        <option value="lpg">LPG</option>
                    </select>
                </label>
                <label>Transmission
                    <select id="filter-transmission">
                        <option value="">Any</option>
                        <option value="manual">Manual</option>
                        <option value="automatic">Automatic</option>
                    </select>
                </label>
                <label>Condition
                    <select id="filter-condition">
                        <option value="">Any</option>
                        <option value="new">New</option>
                        <option value="used">Used</option>
                    </select>
                </label>
                <label>Min price (PKR)
                    <input type="number" id="filter-min-price" min="0" step="50000" placeholder="e.g. 1000000">
                </label>
                <label>Max price (PKR)
                    <input type="number" id="filter-max-price" min="0" step="50000" placeholder="e.g. 5000000">
                </label>
                <label>Min year
                    <input type="number" id="filter-min-year" min="1900" max="2100" placeholder="e.g. 2015">
                </label>
                <label>Max year
                    <input type="number" id="filter-max-year" min="1900" max="2100" placeholder="e.g. 2024">
                </label>
                <label>Sort by
                    <select id="filter-sort">
                        <option value="newest">Newest listed</option>
                        <option value="oldest">Oldest listed</option>
                        <option value="price_asc">Price: low to high</option>
                        <option value="price_desc">Price: high to low</option>
                        <option value="year_desc">Model year: newest</option>
                        <option value="year_asc">Model year: oldest</option>
                        <option value="mileage_asc">Mileage: lowest</option>
                    </select>
                </label>
            </div>
            <div class="filter-actions">
                <button type="submit" class="filter-apply">Apply filters</button>
                <button type="button" class="filter-reset" id="filter-reset">Reset</button>
                <span class="results-summary" id="results-summary" role="status"></span>
            </div>
        </form>
        <div class="cars-grid" id="cars-container">
            <p style="color: #475569; grid-column: 1/-1; text-align: center;">Loading amazing car deals for you...</p>
        </div>
        <div class="load-more-wrap">
            <button type="button" class="filter-apply" id="load-more" hidden>Load more vehicles</button>
        </div>
    </div>

    <footer class="site-footer">
    <p class="section-eyebrow">FOLLOW US</p>

    </div>
    <p style="margin-top: 1.5rem; font-size: 0.8rem; color: #94a3b8;"></p>
</footer>


    <script src="../js/app.js"></script>
</body>
</html>
